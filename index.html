<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тебе - мой день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6ee;
    --card: #ffffff;
    --ink: #4a3f35;
    --accent: #e88ca0;
    --accent-dark: #d16b82;
    --soft: #f7e8e0;
    --gold: #ffd766;
    --millionaire1: #1c3f94;
    --millionaire2: #060d2b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }

  /* ===== фон: 33 летающих элемента (по числу лет) ===== */
  #bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  #bg i {
    position: absolute;
    top: 105vh;
    display: block;
    opacity: .55;
    animation: rise linear infinite;
    font-style: normal;
  }
  #bg i.circle { border-radius: 50%; }
  #bg i.blob { border-radius: 44% 56% 58% 42%; }
  @keyframes rise {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(-130vh) rotate(360deg); }
  }

  /* ===== mobile-first: база - телефон ===== */
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    padding: 16px 12px calc(64px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(12px + env(safe-area-inset-left, 0px));
    padding-right: calc(12px + env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }

  section.block {
    display: none;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .8s ease, transform .8s ease;
    margin-bottom: 40px;
  }
  section.block.visible { display: block; }
  section.block.shown { opacity: 1; transform: translateY(0); }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: 0 6px 24px rgba(74, 63, 53, .08);
  }
  .card.tint-warm { background: #fffaf3; }
  .card.tint-cool { background: #f7fbff; }
  .card.tint-rose { background: #fff5f9; }
  .card h2 {
    font-family: "Playfair Display", Georgia, serif;
    text-align: center;
    font-size: 1.35rem;
    color: var(--accent-dark);
    margin-bottom: 16px;
    letter-spacing: .02em;
  }
  .card p { margin-bottom: 12px; font-size: 1.05rem; white-space: pre-line; }
  .card p:last-child { margin-bottom: 0; }
  .card p.poem {
    text-align: center;
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    margin: 22px 0;
  }
  .card .divider { text-align: center; color: #d9c4b2; letter-spacing: .3em; margin: 18px 0; }

  /* ===== hero ===== */
  .hero { padding: 0; overflow: hidden; }
  .hero-text { padding: 26px 22px; text-align: center; }
  .hero-overline {
    font-size: .75rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--accent-dark);
    margin-bottom: 14px;
  }
  .hero-title {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 800;
    font-size: 2.3rem;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .hero-script {
    font-family: "Caveat", cursive;
    font-size: 1.9rem;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .hero-text p { text-align: left; }
  .hero-photo { display: none; }

  video.plain {
    width: 100%;
    border-radius: 14px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 6px 24px rgba(74, 63, 53, .12);
  }

  /* ===== кружочек ===== */
  .circle-card {
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.9), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,215,102,.25), transparent 40%),
      linear-gradient(135deg, #fff 0%, #ffeef3 45%, #ffe0ea 100%);
    border: 1px solid #ffd3e0;
  }
  .circle-wrap { display: flex; justify-content: center; padding: 8px 0 4px; }
  .circle-frame {
    width: min(88vw, 480px);
    height: min(88vw, 480px);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(209, 107, 130, .4);
    border: 5px solid var(--accent);
  }
  .circle-frame video { width: 100%; height: 100%; object-fit: cover; }

  /* ===== голосование «Кто хочет стать миллионером» ===== */
  .quiz {
    margin-top: 20px;
    border-radius: 16px;
    padding: 22px 16px;
    background: radial-gradient(circle at 50% 0%, var(--millionaire1), var(--millionaire2) 75%);
    color: #fff;
    box-shadow: inset 0 0 40px rgba(0,0,0,.45);
  }
  .quiz .q {
    text-align: center;
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .quiz .opts { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  .quiz .opt {
    background: linear-gradient(#1e449f, #0d1e52);
    border: 1px solid #5f7ddb;
    color: #fff;
    padding: 12px 16px;
    border-radius: 999px;
    text-align: left;
    cursor: pointer;
    font-size: .92rem;
    line-height: 1.35;
    transition: transform .12s, box-shadow .12s;
  }
  .quiz .opt b { color: var(--gold); margin-right: 8px; }
  .quiz .opt.sel { box-shadow: 0 0 0 2px var(--gold); transform: scale(1.02); }
  .quiz textarea {
    width: 100%;
    min-height: 64px;
    border-radius: 12px;
    border: 1px solid #5f7ddb;
    background: rgba(255,255,255,.08);
    color: #fff;
    padding: 12px 14px;
    font: inherit;
    font-size: .95rem;
    resize: vertical;
    margin-bottom: 14px;
  }
  .quiz textarea::placeholder { color: rgba(255,255,255,.55); }
  .quiz .answer-btn {
    display: block;
    margin: 0 auto;
    border: none;
    border-radius: 999px;
    padding: 13px 38px;
    font-size: 1rem;
    font-weight: 700;
    color: #3a2b00;
    background: linear-gradient(#ffe9a3, var(--gold));
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255, 215, 102, .35);
  }
  .quiz .answer-btn:active { transform: scale(.97); }

  /* ===== модалка с ответом ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(30, 16, 24, .55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 30px 26px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: pop .35s ease;
  }
  @keyframes pop {
    from { transform: scale(.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal .big {
    font-family: "Caveat", cursive;
    font-size: 2rem;
    color: var(--accent-dark);
    margin-bottom: 18px;
  }
  .modal button {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 11px 30px;
    border-radius: 999px;
    font-size: 1rem;
    cursor: pointer;
  }

  .playall-zone { margin-bottom: 16px; text-align: center; }
  .playall {
    border: 1.5px solid var(--accent);
    background: #fff;
    color: var(--accent-dark);
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .playall:active { background: var(--accent); color: #fff; }

  .voice {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--soft);
    border-radius: 999px;
    padding: 10px 14px 10px 8px;
    margin-bottom: 12px;
    transition: box-shadow .2s;
  }
  .voice.playing { box-shadow: 0 0 0 2px var(--accent); }
  .voice button.play {
    flex: 0 0 48px;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
  }
  .voice button.play:active { background: var(--accent-dark); }
  .voice .mid { flex: 1; min-width: 0; }
  .voice .label {
    font-size: .82rem;
    color: #9b8b7d;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .voice .bar {
    height: 6px;
    background: #e5d5c8;
    border-radius: 3px;
    overflow: hidden;
  }
  .voice .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent-dark);
    border-radius: 3px;
    transition: width .15s linear;
  }
  .voice .time { font-size: .8rem; color: #9b8b7d; font-variant-numeric: tabular-nums; }

  .next-zone { text-align: center; margin-top: 24px; }
  .next-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    padding: 15px 34px;
    width: 100%;
    max-width: 320px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(209, 107, 130, .4);
    transition: transform .15s, background .2s;
  }
  .next-btn:active { background: var(--accent-dark); transform: scale(.97); }

  .playlist-link {
    display: inline-block;
    margin-top: 6px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 15px 30px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(209, 107, 130, .4);
  }
  .fin { text-align: center; color: #b09c8c; font-size: .9rem; margin-top: 40px; }

  /* ===== десктоп: надстройка ===== */
  @media (min-width: 600px) {
    body {
      font-size: 16px;
      padding: 32px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card { padding: 28px 24px; border-radius: 20px; }
    .card p { font-size: 1.02rem; }
    section.block { margin-bottom: 56px; }

    .hero { display: grid; grid-template-columns: 1.15fr .85fr; }
    .hero-text { padding: 34px 10px 34px 30px; text-align: left; }
    .hero-text p { text-align: left; }
    .hero-photo {
      display: block;
      position: relative;
      min-height: 100%;
    }
    .hero-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 38%);
      mask-image: linear-gradient(to right, transparent 0%, #000 38%);
    }

    video.plain { width: auto; max-width: 100%; max-height: 62vh; }

    .quiz { padding: 26px 26px; }
    .quiz .opts { grid-template-columns: 1fr 1fr; }

    .playall:hover { background: var(--accent); color: #fff; }
    .voice button.play:hover { background: var(--accent-dark); }
    .next-btn:hover { background: var(--accent-dark); transform: scale(1.04); }
    .next-btn { width: auto; }
  }
</style>
</head>

/* ===================== */

/* ===== фон: ровно 33 элемента ===== */
(function makeBg() {
  const bg = document.createElement("div");
  bg.id = "bg";
  const colors = ["#f6c1d1", "#f9dcc4", "#d9e4f5", "#e5d4f1", "#fde9b8", "#f3c6b8"];
  const glyphs = ["✦", "❤"];
  for (let i = 0; i < 33; i++) {
    const s = document.createElement("i");
    const r = Math.random();
    const size = 8 + Math.random() * 20;
    const color = colors[i % colors.length];
    if (r < 0.45) {
      s.className = "circle";
      s.style.width = s.style.height = size + "px";
      s.style.background = color;
    } else if (r < 0.75) {
      s.className = "blob";
      s.style.width = size + "px";
      s.style.height = size * 0.8 + "px";
      s.style.background = color;
    } else {
      s.textContent = glyphs[i % glyphs.length];
      s.style.color = color;
      s.style.fontSize = size + "px";
    }
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 16 + Math.random() * 22 + "s";
    s.style.animationDelay = -Math.random() * 38 + "s";
    bg.appendChild(s);
  }
  document.body.prepend(bg);
})();

const wrap = document.getElementById("wrap");
const sections = [];

function addSection(html) {
  const s = document.createElement("section");
  s.className = "block";
  s.innerHTML = html;
  wrap.appendChild(s);
  sections.push(s);
  return s;
}

function fmt(t) {
  if (!isFinite(t)) return "0:00";
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}

/* глобальный стоп: каждый блок голосовых регистрирует свой stopAll */
const stopFns = [];
function stopCurrent() { stopFns.forEach(f => f()); }

function voiceRow(item, idx) {
  return `
  <div class="voice">
    <button class="play" data-src="${item.src}">▶</button>
    <div class="mid">
      <div class="label">${idx + 1}. ${item.label || "Запись"}</div>
      <div class="bar"><i></i></div>
    </div>
    <div class="time">·:··</div>
  </div>`;
}

function bindVoices(section) {
  const tracks = [];
  let playAll = false;
  let current = null;
  const allBtn = section.querySelector(".playall");

  function updateAllBtn() {
    if (allBtn) allBtn.textContent = playAll ? "⏸ Остановить" : "▶ Слушать всё подряд";
  }

  function play(t) {
    tracks.forEach(x => { if (!x.audio.paused) x.audio.pause(); x.btn.textContent = "▶"; });
    if (current) current.row.classList.remove("playing");
    current = t;
    t.row.classList.add("playing");
    t.audio.play();
    t.btn.textContent = "⏸";
  }

  function stopAll() {
    tracks.forEach(t => { if (!t.audio.paused) t.audio.pause(); t.btn.textContent = "▶"; });
    if (current) { current.row.classList.remove("playing"); current = null; }
    playAll = false;
    updateAllBtn();
  }
  stopFns.push(stopAll);

  section.querySelectorAll("button.play").forEach(btn => {
    const audio = new Audio(btn.dataset.src);
    const row = btn.closest(".voice");
    const t = { audio, btn, row, bar: row.querySelector(".bar i"), time: row.querySelector(".time") };
    tracks.push(t);

    audio.addEventListener("loadedmetadata", () => { t.time.textContent = fmt(audio.duration); });
    audio.addEventListener("timeupdate", () => {
      if (audio.duration) t.bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
      t.time.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
    });
    audio.addEventListener("ended", () => {
      t.btn.textContent = "▶";
      t.bar.style.width = "0%";
      const idx = tracks.indexOf(t);
      if (playAll && idx >= 0 && idx < tracks.length - 1) {
        play(tracks[idx + 1]);
      } else {
        if (current === t) { t.row.classList.remove("playing"); current = null; }
        playAll = false;
        updateAllBtn();
      }
    });
    btn.addEventListener("click", () => {
      if (current === t && !audio.paused) { stopAll(); return; }
      stopCurrent();
      playAll = false;
      updateAllBtn();
      play(t);
    });
  });

  if (allBtn) allBtn.addEventListener("click", () => {
    if (playAll) { stopAll(); return; }
    stopCurrent();
    playAll = true;
    updateAllBtn();
    play(tracks[0]);
  });
}

function bindVideos(section) {
  section.querySelectorAll("video").forEach(v => {
    v.addEventListener("play", () => stopCurrent());
  });
}

function bindQuiz(section) {
  const modal = document.getElementById("modal");
  section.querySelectorAll(".opt").forEach(o => {
    o.addEventListener("click", () => {
      section.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
      o.classList.add("sel");
    });
  });
  section.querySelector(".answer-btn").addEventListener("click", () => {
    modal.classList.add("open");
  });
}
document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal").classList.remove("open");
});
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") e.target.classList.remove("open");
});

function buildNextButton(section, isLast) {
  if (isLast) return;
  const zone = document.createElement("div");
  zone.className = "next-zone";
  const btn = document.createElement("button");
  btn.className = "next-btn";
  btn.textContent = "Дальше ↓";
  btn.addEventListener("click", () => {
    stopCurrent();
    section.querySelectorAll("video").forEach(v => v.pause());
    zone.remove();
    revealNext();
  });
  zone.appendChild(btn);
  section.appendChild(zone);
}

let revealed = 0;
function revealNext() {
  if (revealed >= sections.length) return;
  const s = sections[revealed++];
  s.classList.add("visible");
  void s.offsetWidth;
  s.classList.add("shown");
  setTimeout(() => s.scrollIntoView({ behavior: "smooth", block: "start" }), 150);
}

/* ---- сборка секций по порядку ---- */
const builders = [];

if (CONTENT.introText) builders.push(() =>
  addSection(`<div class="card hero">
    <div class="hero-text">
      <div class="hero-overline">${CONTENT.heroOverline}</div>
      <div class="hero-title">${CONTENT.heroTitle}</div>
      <div class="hero-script">${CONTENT.heroScript}</div>
      <p>${CONTENT.introText}</p>
    </div>
    <div class="hero-photo"><img src="${CONTENT.heroPhoto}" alt="Мы на выпускном"></div>
  </div>`));

if (CONTENT.mainVideo) builders.push(() => {
  const s = addSection(`<div class="card"><h2>Смотри</h2>
    <video class="plain" controls playsinline preload="metadata" src="${CONTENT.mainVideo}"></video></div>`);
  bindVideos(s);
});

if (CONTENT.audio1.length) builders.push(() => {
  const s = addSection(`<div class="card tint-warm"><h2>Голосовые с диктофона</h2>
    <div class="playall-zone"><button class="playall">▶ Слушать всё подряд</button></div>
    ${CONTENT.audio1.map(voiceRow).join("")}</div>`);
  bindVoices(s);
});

if (CONTENT.circleVideo) builders.push(() => {
  const letters = ["А", "Б", "В", "Г"];
  const s = addSection(`<div class="card circle-card"><h2>Пауза на кружочек</h2>
    <div class="circle-wrap"><div class="circle-frame">
    <video controls playsinline preload="metadata" src="${CONTENT.circleVideo}"></video>
    </div></div>
    <div class="quiz">
      <div class="q">${CONTENT.quiz.question}</div>
      <div class="opts">
        ${CONTENT.quiz.options.map((o, i) => `<button class="opt"><b>${letters[i]}:</b>${o}</button>`).join("")}
      </div>
      <textarea placeholder="Свой вариант"></textarea>
      <button class="answer-btn">Ответить</button>
    </div>
  </div>`);
  bindVideos(s);
  bindQuiz(s);
});

if (CONTENT.audio2.length) builders.push(() => {
  const offset = CONTENT.audio1.length;
  const s = addSection(`<div class="card tint-cool"><h2>Продолжаем</h2>
    <div class="playall-zone"><button class="playall">▶ Слушать всё подряд</button></div>
    ${CONTENT.audio2.map((it, i) => voiceRow(it, offset + i)).join("")}</div>`);
  bindVoices(s);
});

if (CONTENT.outro.length) builders.push(() => {
  const inner = CONTENT.outro.map(part => {
    if (part.kind === "poem") return `<p class="poem">${part.text}</p>`;
    if (part.kind === "divider") return `<div class="divider">* * *</div>`;
    return `<p>${part.text}</p>`;
  }).join("");
  addSection(`<div class="card"><h2>Ну вот и всё… почти</h2>${inner}</div>`);
});

if (CONTENT.playlistUrl) builders.push(() => {
  addSection(`<div class="card tint-rose"><h2>Бонус: плейлист 🎧</h2>
    <div style="text-align:center"><a class="playlist-link" href="${CONTENT.playlistUrl}" target="_blank" rel="noopener">${CONTENT.playlistLabel}</a></div>
    </div><div class="fin">сделано с теплом · ${new Date().getFullYear()}</div>`);
});

builders.forEach(b => b());
sections.forEach((s, i) => buildNextButton(s, i === sections.length - 1));
revealNext();
</script>
</body>
</html>
